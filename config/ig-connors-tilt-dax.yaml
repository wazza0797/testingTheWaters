# IG Markets Germany 40 — Connors core+tilt runner (tilt sleeve).
#
# Locked research: separate ~1% DAX leg (not in US bucket). Vol throttle 1.5×
# is precautionary for DAX (n=1 covid fill that flipped the cliff) — do not
# silently harden beyond the shared gate; log skips instead.
#
# Epic: research parquet is IX.D.DAX.DAILY.IP (Yahoo stand-in). CFD demo may
# prefer IFM — swap symbol when demo-ready and backfilled.
#
#   uv run trading-platform backtest --overlay ig-connors-tilt-dax
#   uv run trading-platform demo --overlay ig-connors-tilt-dax

trading:
  exchange: ig
  symbol: IX.D.DAX.DAILY.IP
  timeframe: 1d

demo:
  poll_interval_sec: 30
  order_poll_interval_sec: 5
  state_file: "demo_state_ig_connors_tilt_dax.json"

backtest:
  starting_cash: "100000"
  position_size_pct: 1.0
  cash_safety_buffer_pct: 0.001
  spread_bps: 0.8
  spread_volatility_k: 0.15
  spread_atr_period: 14
  latency_bars: 1
  volume_participation_rate: 0.10
  assume_full_liquidity_when_no_volume: true
  assume_maker_on_limit: true
  use_next_bar_open: true

validation:
  enabled: false

analytics:
  min_round_trips: 20
  min_bars: 250
  min_daily_returns_for_sharpe: 30
  bootstrap_iterations: 1000
  bootstrap_seed: 42
  market_sma_period: 200

strategy:
  path: "trading_platform.strategies.examples.connors_core_tilt:ConnorsCoreTiltStrategy"
  params:
    rsi_period: 2
    rsi_threshold: 15.0
    sma_regime_period: 200
    sma_exit_period: 5
    time_stop_bars: 10
    atr_period: 14
    atr_stop_mult: 2.0
    risk_pct: 0.01
    vol_fast: 10
    vol_slow: 60
    vol_throttle_ratio: 1.5
