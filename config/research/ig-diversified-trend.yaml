# IG diversified trend-following — hybrid cost registry (Phase 0.5).
#
# Prices for research: Yahoo daily stand-ins under IG epic paths via
# scripts/backfill_ig_external.py. Yahoo ≠ IG mid — results are indicative.
#
# Product mix (confirmed on IG demo 2026-09-17):
#   - Index / bond / commodity legs → futures CFDs (no overnight funding;
#     wider spread; dated expiry; auto-roll ≈ another N× dealing spread).
#   - FX legs → cash CFDs only (no futures-CFD FX on demo); tom-next stub.
#
# Never use DFB / *.DAILY.IP for CFD demo. Prefer FWM (mini) futures epics.
#
# Locked signal defaults:
#   SMA(100) L/S; risk 0.75%/ATR20; class cap 30%; circuit −3%/day;
#   resize weekly; next-open fills.

defaults:
  timeframe: 1d
  risk_pct: 0.0075
  atr_period: 20
  sma_period: 100
  asset_class_cap: 0.30
  gross_leverage_cap: 20.0
  circuit_breaker_day_pct: -0.03
  resize_every_bars: 5
  starting_equity: 100000
  # Roll cost multiplier on futures dealing spread (sensitivity: 1 / 1.5 / 2).
  roll_spread_mult: 1.0
  # FX cash overnight stub (bps of notional / day). Futures legs override to 0.
  fx_financing_bps_per_day: 0.5

