# IG Markets Germany 40 — Connors corroboration sleeve (daily Yahoo stand-in).
# Signal source: Yahoo ^GDAXI. Yahoo ≠ IG CFD mid.
#
# Epic: IX.D.DAX.DAILY.IP for research path continuity with existing daily
# parquet (same Yahoo series as cash). Live CFD demo prefers IFM/FWM;
# this overlay is research-only.
#
#   uv run python scripts/backfill_ig_external.py --yahoo '^GDAXI' \
#       --epic IX.D.DAX.DAILY.IP --timeframe 1d
#   uv run python scripts/research_connors_rsi2.py --overlays ig-dax-daily
#
# Costs: ~0.8 bps spread floor. Overnight financing: IG cash long
# (admin 3% + EUR benchmark) / 360; see research_connors_rsi2.py.

trading:
  exchange: ig
  symbol: IX.D.DAX.DAILY.IP
  timeframe: 1d

backtest:
  starting_cash: "100000"
  position_size_pct: 1.0
  cash_safety_buffer_pct: 0.001
  spread_bps: 0.8
  spread_volatility_k: 0.15
  spread_atr_period: 14
  latency_bars: 1
  volume_participation_rate: 0.10
  assume_full_liquidity_when_no_volume: true
  assume_maker_on_limit: true
  use_next_bar_open: true

validation:
  enabled: false

analytics:
  min_round_trips: 20
  min_bars: 250
  min_daily_returns_for_sharpe: 30
  bootstrap_iterations: 1000
  bootstrap_seed: 42
  market_sma_period: 200

strategy:
  path: "trading_platform.strategies.examples.connors_rsi2:ConnorsRsi2Strategy"
  params:
    rsi_period: 2
    rsi_threshold: 10.0
    sma_regime_period: 200
    sma_exit_period: 5
    time_stop_bars: 10
    atr_period: 14
    atr_stop_mult: 2.0
    risk_pct: 0.01
