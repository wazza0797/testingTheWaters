# Demo-trading overlay — merged over default.yaml when running
# `trading-platform demo` (Milestone 8a). Orders go to the exchange sandbox
# selected by `trading.exchange` (factory → adapter); not local FillSimulator.
#
# Research sleeves can skip editing this file:
#   uv run trading-platform demo --overlay ig-us500
#   uv run trading-platform demo-smoke --overlay ig-us500
trading:
  exchange: binance
  symbol: BTC/USDT
  timeframe: 1h

# --- IG Markets demo (CFDs) -------------------------------------------------
# Uncomment the block below (and comment out the Binance `trading:` above) for
# IG. Set ENV=demo + IG_DEMO_* in .env. `symbol` is the IG epic (not BASE/QUOTE).
# trading:
#   exchange: ig
#   symbol: CS.D.GBPEUR.CFD.IP
#   timeframe: 1h

demo:
  poll_interval_sec: 30          # closed-bar poll + heartbeat cadence
  order_poll_interval_sec: 5     # reserved; demo loop uses poll_interval_sec
  state_file: "demo_state.json"  # relative to DATA_DIR

# Position sizing still uses backtest risk knobs until demo-specific sizing lands.
backtest:
  position_size_pct: 1.0
  cash_safety_buffer_pct: 0.001

strategy:
  path: "trading_platform.strategies.examples.sma_crossover:SmaCrossoverStrategy"
  params:
    fast_period: 10
    slow_period: 30
