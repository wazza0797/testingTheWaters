# Backtest fill-simulation parameters (Milestone 4 / 4.5). Merged over
# default.yaml when running `trading-platform backtest`.
backtest:
  starting_cash: "10000"           # quoted: parsed as Decimal, not float
  position_size_pct: 1.0           # fraction of equity risked per trade (long-only, no sizing module yet)
  cash_safety_buffer_pct: 0.001    # extra headroom (on top of taker fee) so 100% sizing can't overdraw cash
  spread_bps: 5                    # floor spread; set spread_volatility_k > 0 to widen with ATR
  spread_volatility_k: 0.0         # 0 = flat spread (M4 behaviour); try 2.0 for vol-aware fills
  spread_atr_period: 14
  latency_bars: 1
  volume_participation_rate: 0.10  # max % of bar volume per partial fill
  assume_maker_on_limit: true      # limit orders default to maker if non-crossing
  use_next_bar_open: true          # fill price at next bar open (with latency)

# Hold-out train/test split (Milestone 4.5 Phase A). Disabled by default —
# enable and set dates to run IS then OOS side-by-side. OOS is the only
# result that counts for strategy validation.
validation:
  enabled: false
  # train_end: "2025-01-01"      # in-sample ends here (exclusive)
  # test_start: "2025-01-01"     # out-of-sample starts here (inclusive)
  # test_end: null               # null = end of loaded range; optional embargo via train_end < test_start

  # Walk-forward (Milestone 4.5 Phase C) — used by `trading-platform walk-forward`.
  # Independent of `enabled` / hold-out dates. Keep the grid small for smoke tests;
  # expand for real research runs.
  walk_forward:
    is_bars: 8760                # ~1y of 1h bars for IS optimization
    oos_bars: 2190               # ~3m OOS per fold
    step_bars: 2190              # slide by OOS length (non-overlapping OOS)
    objective: sharpe_daily      # or total_return_pct
    param_grid:
      fast_period: [5, 10, 15]
      slow_period: [20, 30, 40]

# Performance analytics thresholds (Milestone 5). Defaults match the milestone
# significance table; override bootstrap_seed for reproducible CI experiments.
analytics:
  min_round_trips: 30
  min_bars: 500
  min_daily_returns_for_sharpe: 30
  bootstrap_iterations: 1000
  bootstrap_seed: 42
  market_sma_period: 200

# Reference strategy run by `trading-platform backtest` — see
# strategies/examples/sma_crossover.py. Swap `path`/`params` to backtest a
# different strategy; no code changes required (strategies/loader.py).
strategy:
  path: "trading_platform.strategies.examples.sma_crossover:SmaCrossoverStrategy"
  params:
    fast_period: 10
    slow_period: 30
